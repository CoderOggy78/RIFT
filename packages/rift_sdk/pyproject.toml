[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rift-sdk"
version = "0.1.0"
description = "Lightweight tracing and observability SDK for AI agents"
readme = "README.md"
authors = [{ name = "RIFT Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
